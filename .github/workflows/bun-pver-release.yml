# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Publish to npm
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  UPSTREAM_REPOS: "cli" # comma-separated list, e.g. "eval,tscircuit,docs"
  UPSTREAM_PACKAGES_TO_UPDATE: "circuit-json-to-step" # comma-separated list, e.g. "@tscircuit/core,@tscircuit/protos"

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install -g pver
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: pver release --no-push-main
        env:
          GITHUB_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}

      - name: Get package version
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: bump version to ${{ steps.package-version.outputs.version }}"
          title: "chore: bump version to ${{ steps.package-version.outputs.version }}"
          body: "Automated package update"
          branch: bump-version-${{ github.run_number }}
          base: main
          token: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}
          committer: tscircuitbot <githubbot@tscircuit.com>
          author: tscircuitbot <githubbot@tscircuit.com>

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number != ''
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}

      - name: Wait for npm publication
        if: env.UPSTREAM_REPOS && env.UPSTREAM_PACKAGES_TO_UPDATE
        env:
          EXPECTED_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            published_version=$(npm view circuit-json-to-step@latest version --prefer-online 2>/dev/null || true)
            if [ -n "$published_version" ] && bun -e 'process.exit(Bun.semver.satisfies(process.argv[1], ">=" + process.argv[2]) ? 0 : 1)' "$published_version" "$EXPECTED_VERSION"; then
              exit 0
            fi
            echo "Waiting for circuit-json-to-step@$EXPECTED_VERSION on npm ($attempt/30)."
            sleep 10
          done
          echo "::error::The published STEP converter is not available from npm yet."
          exit 1

      - name: Trigger upstream repo updates
        if: env.UPSTREAM_REPOS && env.UPSTREAM_PACKAGES_TO_UPDATE
        run: |
          IFS=',' read -ra REPOS <<< "${{ env.UPSTREAM_REPOS }}"
          for repo in "${REPOS[@]}"; do
            if [[ -n "$repo" ]]; then
              echo "Triggering update for repo: $repo"
              curl --fail-with-body -X POST \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Authorization: token ${{ secrets.TSCIRCUIT_BOT_GITHUB_TOKEN }}" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/tscircuit/$repo/actions/workflows/update-package.yml/dispatches" \
                -d "{\"ref\":\"main\",\"inputs\":{\"package_names\":\"${{ env.UPSTREAM_PACKAGES_TO_UPDATE }}\"}}"
            fi
          done
